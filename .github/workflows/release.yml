name: Release

# Tag vX.Y.Z on main: tests, container image on GHCR and a GitHub release whose
# notes are the matching CHANGELOG.md section. A tag without that section does
# not publish. Same flow as AlexGalhardo/vukem releases and hexascore-app.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag to release, for example v0.2.0
        required: true
        type: string

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push the image to GHCR
      id-token: write # Sigstore identity for build provenance
      attestations: write # build provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.VERSION }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Database integration tests skip without TEST_DATABASE_URL; CI already ran them on main.
      - run: go test -race -count=1 ./...
      # The notes come from the default branch: a tag on an older commit (a
      # retroactive or re-published release) predates its own CHANGELOG section.
      - name: Extract the CHANGELOG section
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="${VERSION#v}"
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          git show FETCH_HEAD:CHANGELOG.md > "$RUNNER_TEMP/CHANGELOG.md"
          awk -v h="## [$version]" 'index($0, h) == 1 {p=1; next} p && index($0, "## [") == 1 {exit} p' "$RUNNER_TEMP/CHANGELOG.md" > release-notes.md
          test -s release-notes.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: RAILWAY_GIT_COMMIT_SHA=${{ env.VERSION }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: release-notes.md
          tag_name: ${{ env.VERSION }}
