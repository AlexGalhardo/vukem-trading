name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each job asks for the scopes it needs and nothing more.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Format, vet and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: scooby
          POSTGRES_PASSWORD: scooby
          POSTGRES_DB: scooby_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scooby -d scooby_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://scooby:scooby@localhost:5432/scooby_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # govulncheck is pinned in go.mod as a Go tool; new advisories appear
      # after your code ships, so this also runs on a schedule-free rerun.
      - name: govulncheck
        run: go tool govulncheck ./...

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Pinned release and the sha256 of its linux_x64 archive.
      BETTERLEAKS_VERSION: 1.9.0
      BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Betterleaks
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${archive}"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" betterleaks
          sudo install betterleaks /usr/local/bin/betterleaks
      # The whole history, with the rules in .betterleaks.toml. Validation
      # against provider APIs stays off (it would need --validation).
      - name: betterleaks
        run: betterleaks git . --no-banner --redact --report-format json --report-path "$RUNNER_TEMP/betterleaks.json"
      # Rule, file and line only: the matched value is never printed.
      - name: Summarize findings
        if: failure()
        run: jq -r '.[] | "\(.RuleID) \(.File):\(.StartLine) \(.Commit[0:7])"' "$RUNNER_TEMP/betterleaks.json" | sort | uniq -c

  image:
    name: Build the production image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same build Railway, Fly, Render and plain Docker run. It also
      # covers the front-end build, so a broken asset pipeline fails here.
      - name: docker build
        run: docker build -t vukem-trading:ci .

  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun run lint
      - run: bun run lint:md
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  site:
    name: Documentation site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - name: Content is in sync with docs/
        run: |
          bun run sync:docs
          git diff --exit-code -- content
      - run: bun run lint
      - run: bun run check:mdx
      - run: bun run test:scripts
      - run: bun run build

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  fuzz:
    name: Fuzz (short)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz the CSV importer
        run: go test -run '^$' -fuzz=FuzzImportCSV -fuzztime=15s ./internal/trading
      - name: Fuzz the strategy signals
        run: go test -run '^$' -fuzz=FuzzSignal -fuzztime=15s ./internal/trading
